<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f1ede3">
  <meta data-copy-description name="description" content="選一款 3D 捏捏，用手勢捏碎脆皮，或感受柔軟的回彈。">
  <link rel="icon" href="./public-mark.svg" type="image/svg+xml">
  <title>脆皮捏捏模擬器</title>
  <script type="module" src="./src/main.js"></script>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" class="symbols" aria-hidden="true">
    <symbol id="mark" viewBox="0 0 32 32"><path d="M16 2.5 28 9.3v13.4L16 29.5 4 22.7V9.3Z"/><path d="m4 9.3 12 7 12-7M16 16.3v13.2m-4-15.5 6-6 2.2 5.7"/></symbol>
    <symbol id="camera-icon" viewBox="0 0 24 24"><rect x="3" y="6" width="12" height="12" rx="2"/><path d="m15 10 6-3v10l-6-3"/></symbol>
    <symbol id="reset-icon" viewBox="0 0 24 24"><path d="M4 11a8 8 0 1 1 2 7M4 5v6h6"/></symbol>
    <symbol id="sound-icon" viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3zM16 9a4 4 0 0 1 0 6m3-9a8 8 0 0 1 0 12"/></symbol>
    <symbol id="muted-icon" viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3zM16 10l5 5m0-5-5 5"/></symbol>
  </svg>
  <main class="shell">
    <header class="masthead">
      <div class="wordmark"><svg class="icon"><use href="#mark"/></svg> CRUNCH LAB</div>
      <label class="language-switch">
        <span data-copy="language">語言</span>
        <select id="language">
          <option value="system" data-copy="systemLanguage">系統預設</option>
          <option value="zh-Hant" lang="zh-Hant">繁體中文</option>
          <option value="zh-Hans" lang="zh-Hans">简体中文</option>
          <option value="en" lang="en">English</option>
        </select>
      </label>
    </header>
    <section class="intro" aria-labelledby="title">
      <h1 id="title"><span data-copy="title">脆皮捏捏模擬器</span><span class="title-dot">.</span></h1>
    </section>
    <div class="play-settings">
      <fieldset class="segmented">
        <legend data-copy="quantity">捏幾顆</legend>
        <label><input class="sr-only" type="radio" name="quantity" value="1" checked><span data-copy="one">捏一顆</span></label>
        <label><input class="sr-only" type="radio" name="quantity" value="2"><span data-copy="two">捏兩顆</span></label>
      </fieldset>
      <fieldset class="segmented" id="picker-target" hidden>
        <legend data-copy="pickerTarget">換哪一顆</legend>
        <label><input class="sr-only" type="radio" name="picker-target" value="0" checked><span data-copy="leftItem">左顆款式</span></label>
        <label><input class="sr-only" type="radio" name="picker-target" value="1"><span data-copy="rightItem">右顆款式</span></label>
      </fieldset>
    </div>
    <fieldset class="picker">
      <legend data-copy="picker">選擇捏捏</legend>
      <div class="specimen-options">
        <label class="specimen-option">
          <input class="sr-only" type="radio" name="squishy" value="chocolate" checked>
          <span class="specimen-choice"><svg aria-hidden="true" viewBox="0 0 44 32"><path fill="#753e2c" d="M7 16C7 8 13 3 22 3s15 5 15 13-7 13-15 13S7 24 7 16Z"/><path fill="#99a154" d="M22 13c5-3 10-2 15 0v3c0 8-7 13-15 13-3-5-4-11 0-16Z"/><path d="m24 18 5-2m-4 7 6-4m-3 5 5-3" stroke="#edc979" stroke-width="1.5" stroke-linecap="round"/></svg><span><strong>杜拜巧克力</strong><small data-copy="crispy">脆皮</small></span></span>
        </label>
        <label class="specimen-option">
          <input class="sr-only" type="radio" name="squishy" value="butter">
          <span class="specimen-choice"><svg aria-hidden="true" viewBox="0 0 44 32"><path fill="#dca654" d="M5 12 28 7l11 6v10l-23 5-11-6Z"/><path fill="#f7d686" d="M5 12 28 7l11 6-23 6Z"/><path fill="#ebbc62" d="m16 19 23-6v10l-23 5Z"/><path fill="none" stroke="#fff4cf" stroke-width="1.5" d="m21 9 4 3-2 5 4 3-1 5"/></svg><span><strong>奶油塊</strong><small data-copy="crispy">脆皮</small></span></span>
        </label>
        <label class="specimen-option">
          <input class="sr-only" type="radio" name="squishy" value="egg">
          <span class="specimen-choice"><svg aria-hidden="true" viewBox="0 0 44 32"><path fill="#fff8e7" stroke="#d9c8aa" d="M7 11c3-3 6-1 9-5s9-4 12 0 9 2 11 7-1 9-6 11-5 4-10 4-6-3-12-3S2 16 7 11Z"/><circle cx="22" cy="15" r="7" fill="#f1a126"/><path d="M19 13q1-2 4-2" stroke="#ffdb87" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg><span><strong>荷包蛋</strong><small data-copy="springy">回彈</small></span></span>
        </label>
        <label class="specimen-option">
          <input class="sr-only" type="radio" name="squishy" value="doughnut">
          <span class="specimen-choice"><svg aria-hidden="true" viewBox="0 0 44 32"><ellipse cx="22" cy="17" rx="13" ry="10" fill="none" stroke="#ce8e58" stroke-width="7"/><ellipse cx="22" cy="14.5" rx="13" ry="9.5" fill="none" stroke="#eea4b4" stroke-width="7"/><path d="m12 11 3-2m11-3 3 2m4 11 3-2" stroke="#ffe4df" stroke-width="1.5" stroke-linecap="round"/></svg><span><strong>甜甜圈</strong><small data-copy="springy">回彈</small></span></span>
        </label>
        <label class="specimen-option">
          <input class="sr-only" type="radio" name="squishy" value="macaron">
          <span class="specimen-choice"><svg aria-hidden="true" viewBox="0 0 44 32"><path fill="#d87492" d="M6 15c0-6 7-10 16-10s16 4 16 10v5c0 5-7 9-16 9S6 25 6 20Z"/><path fill="#8ea9df" d="M6 16c5 3 10 4 16 4s11-1 16-4v5c-4 3-10 4-16 4s-12-1-16-4Z"/><ellipse cx="22" cy="13" rx="16" ry="8" fill="#f3a5b6"/><path d="M12 12c2-2 5-3 8-3" fill="none" stroke="#ffd9df" stroke-width="1.5" stroke-linecap="round"/></svg><span><strong>馬卡龍</strong><small data-copy="crispy">脆皮</small></span></span>
        </label>
        <label class="specimen-option">
          <input class="sr-only" type="radio" name="squishy" value="creamPuff">
          <span class="specimen-choice"><svg aria-hidden="true" viewBox="0 0 44 32"><path fill="#c57732" d="M5 20c0-4 3-6 4-9 2-5 7-4 10-6 4-2 7 0 9 1 5 0 8 4 9 8 4 4 2 10-2 12-7 4-22 4-27 0-2-1-3-3-3-6Z"/><path fill="#e6a34f" d="M7 17c1-3 3-4 4-7 2-4 5-3 9-5 3-1 5 0 8 1 4 0 7 3 8 7-3 0-4 3-8 3-4-1-6 2-10 1-4-1-7 3-11 0Z"/><path d="m12 13 4-3 4 2 4-3 4 2m-9 6 3-5m-9 9c4-2 6 2 10 0 4-3 6-1 10-3" fill="none" stroke="#fff0b1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span><strong>香草菠蘿泡芙</strong><small data-copy="crispy">脆皮</small></span></span>
        </label>
      </div>
    </fieldset>
    <section class="bench" aria-label="脆皮捏捏實驗台" data-copy-label="bench">
      <div class="stage-pair" id="stage-pair">
        <div class="stage-slot">
          <figure class="stage" data-item="chocolate">
            <div class="scene" role="img" aria-label="完整的 3D 杜拜巧克力"></div>
            <div class="stage-top"><span><i></i><span class="plate">DUBAI CHOCOLATE</span></span><span class="side-label" hidden></span></div>
            <div class="reticle" aria-hidden="true"></div>
            <figcaption><span class="specimen">杜拜巧克力</span><span class="stage-count">完整 · 0/3</span></figcaption>
            <div class="scene-error" data-copy="sceneError" hidden>無法顯示 3D 捏捏。請使用支援 WebGL 2 的瀏覽器，並開啟硬體加速。</div>
          </figure>
          <button class="side-squeeze" type="button" hidden>手動捏左顆</button>
        </div>
      </div>
      <aside class="controls" aria-label="互動控制" data-copy-label="controls">
        <div class="control-head">
          <h2 data-copy="gestureControls">手勢控制</h2>
          <button id="sound" class="icon-button" type="button" aria-label="音效" data-copy-label="sound" aria-pressed="true" title="音效" data-copy-title="sound"><svg class="icon"><use href="#sound-icon"/></svg></button>
        </div>
        <div class="preview" id="preview" data-live="false">
          <video id="camera-feed" muted playsinline autoplay aria-label="本機相機預覽" data-copy-label="localPreview"></video>
          <canvas id="landmarks" aria-hidden="true"></canvas>
          <div class="preview-placeholder">
            <svg class="icon"><use href="#camera-icon"/></svg>
            <span data-copy="preview">相機預覽</span>
          </div>
          <span class="camera-badge"><i></i><span id="camera-state">未開啟</span></span>
        </div>
        <p class="guidance" id="guidance" aria-live="polite">開啟相機後，先張手，再握拳。</p>
        <button class="camera-button" id="camera-toggle" type="button"><svg class="icon"><use href="#camera-icon"/></svg><span data-copy="startCamera">開啟相機</span></button>
        <div class="secondary">
          <button id="squeeze" type="button"><span data-copy="manual">手動捏一次</span><kbd>Space</kbd></button>
          <button id="reset" type="button"><svg class="icon"><use href="#reset-icon"/></svg><span>重置</span></button>
        </div>
      </aside>
    </section>
    <p class="sr-only" id="announcement" aria-live="polite"></p>
    <footer><span data-copy="privacy">相機畫面只在瀏覽器內處理。</span><span id="footer-gesture">握拳 → 張手 → 再握拳</span></footer>
  </main>
</body>
</html>
